      <stop offset="0%" stop-color="#F7931A" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#18181b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <pattern id="dot-grid" width="48" height="48" patternUnits="userSpaceOnUse">
